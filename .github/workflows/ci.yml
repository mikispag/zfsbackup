name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release
  # run never shares (or cancels) a group with push or pull request runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/zfsbackup

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ZFS_VERSION: "2.4.4"
      ZFS_SHA256: 2a3c70d55a37cc71618a95a60e81ad66530201eb118d37741dc92efcf848c8b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install build deps and test helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool gawk \
            libblkid-dev uuid-dev libudev-dev libssl-dev zlib1g-dev \
            libaio-dev libattr1-dev libelf-dev libtirpc-dev "linux-headers-$(uname -r)" \
            python3 python3-dev python3-setuptools python3-cffi \
            libffi-dev python3-packaging libcurl4-openssl-dev libpam0g-dev \
            bats mbuffer zstd gettext-base openssh-server
      - name: Build and install OpenZFS
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/zfs.tar.gz \
            "https://github.com/openzfs/zfs/releases/download/zfs-${ZFS_VERSION}/zfs-${ZFS_VERSION}.tar.gz"
          echo "${ZFS_SHA256}  /tmp/zfs.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/zfs-src
          tar -xzf /tmp/zfs.tar.gz -C /tmp/zfs-src --strip-components=1
          cd /tmp/zfs-src
          sh autogen.sh
          ./configure --prefix=/usr --sysconfdir=/etc \
            --libdir=/lib/x86_64-linux-gnu \
            --with-udevdir=/lib/udev
          make -s -j"$(nproc)"
          sudo make install
          sudo ldconfig
          sudo depmod -a
          sudo modprobe zfs
          zfs version
      - name: Create loopback ZFS pool
        run: |
          set -euo pipefail
          truncate -s 2G /tmp/zfsbackup-pool.img
          sudo zpool create -f testpool /tmp/zfsbackup-pool.img
          sudo zfs create testpool/zfsbackuptestsuite
          sudo chown "$USER" /tmp/zfsbackup-pool.img
          sudo zfs allow -ldu "$USER" bookmark,canmount,change-key,compression,create,destroy,diff,encryption,keyformat,keylocation,load-key,logbias,mount,mountpoint,promote,readonly,receive,rename,rollback,send,snapshot,userprop testpool/zfsbackuptestsuite
      - name: Run integration tests
        env:
          DELEGATED_FS: testpool/zfsbackuptestsuite
        run: make integration-tests
