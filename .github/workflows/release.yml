name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.3 or v1.3.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as an unpublished draft"
        type: boolean
        default: false
      dry_run:
        description: "Build and preview the release notes without publishing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: Check version and ref
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ $VERSION =~ $semver ]]; then
            echo "::error::Version '$VERSION' is not of the form vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          if [[ $DRY_RUN != true && $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Releases are published from main, not $GITHUB_REF"
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

  test:
    name: CI
    needs: validate
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  build:
    name: Build artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for signing build provenance attestations
      attestations: write # store the attestations on the repository
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Build archives
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir -p build dist
          for target in linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            name="zfsbackup_${VERSION#v}_${goos}_${goarch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "build/$name/zfsbackup" ./cmd/zfsbackup
            cp LICENSE README.md "build/$name/"
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$SOURCE_DATE_EPOCH" -C build -cf - "$name" |
              gzip -9n >"dist/$name.tar.gz"
          done
          (cd dist && sha256sum -- *.tar.gz >SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Smoke-test the Linux x86-64 binary
        run: |
          set -euo pipefail
          got=$("build/zfsbackup_${VERSION#v}_linux_amd64/zfsbackup" --version)
          echo "$got"
          [[ $got == "zfsbackup $VERSION linux/amd64" ]]
      - name: Generate release notes
        run: |
          set -euo pipefail
          .github/scripts/release-notes.sh "$VERSION" dist >notes.md
          cat notes.md >>"$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [validate, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          flags=()
          if [[ $PRERELEASE == true ]]; then flags+=(--prerelease); fi
          if [[ $DRAFT == true ]]; then flags+=(--draft); fi
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "zfsbackup $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
